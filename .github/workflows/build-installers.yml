name: Build Installers

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# The build jobs install packages from PyPI, so they get a read-only token;
# only the release job may write
permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    # check-latest: without it the runner's cached 3.14 is used, which lags
    # a new security release until the runner image is next rebuilt
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'
        check-latest: true

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-build.txt

    - name: Generate gear set data
      run: python scripts/generate_gear_data.py

    - name: Create icon
      run: python scripts/create_icon.py

    - name: Run tests
      # One process for the whole suite. From 2026-10-15 the window-layout
      # test ran in a process of its own, after the whole suite crashed this
      # runner with an access violation in it; tests/conftest.py now frees
      # each test's windows on the UI thread (issue #18)
      run: |
        pip install pytest
        python -m pytest tests/ -q
      env:
        QT_QPA_PLATFORM: offscreen

    - name: Get version
      id: version
      shell: bash
      run: python -c "from src.version import __version__; print(f'VERSION={__version__}')" >> $GITHUB_OUTPUT

    - name: Build GUI executable (onedir, windowed)
      run: python -m PyInstaller esolog-tail.spec --noconfirm

    - name: Compile installer (Inno Setup)
      run: iscc /DAppVersion=${{ steps.version.outputs.VERSION }} installer\esolog-gui.iss

    - name: Create portable zip
      run: |
        Copy-Item README.md dist\esolog-gui\
        Compress-Archive -Path dist\esolog-gui\* -DestinationPath dist\esolog-tail-windows-portable-${{ steps.version.outputs.VERSION }}.zip

    - name: Upload installer artifact
      uses: actions/upload-artifact@v7
      with:
        name: esolog-tail-windows-setup
        path: dist/esolog-tail-windows-setup-${{ steps.version.outputs.VERSION }}.exe

    - name: Upload portable artifact
      uses: actions/upload-artifact@v7
      with:
        name: esolog-tail-windows-portable
        path: dist/esolog-tail-windows-portable-${{ steps.version.outputs.VERSION }}.zip

  build-linux:
    # The oldest hosted image: the bundle runs on this glibc (2.35) and newer.
    # GitHub retires it on 2027-04-17, with day-long brownouts from 2027-03-23
    # (actions/runner-images#14254); ubuntu-24.04 would raise the floor to 2.39.
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'
        check-latest: true

    # docs/design.md is rebuilt by the release commit only (issue #134): a
    # tag whose design notes lag the code fails here, in a second, before
    # either build, and the release job never runs
    - name: Check the design notes are current
      if: startsWith(github.ref, 'refs/tags/')
      run: python scripts/build_design_doc.py --check

    # Qt's X11 and Wayland plugins link against these. PyInstaller bundles
    # the ones it finds, so installing them here is what lets the tarball
    # start on a desktop that lacks them (libxcb-cursor0 is a common gap).
    - name: Install Qt system libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libegl1 libgl1 libdbus-1-3 libfontconfig1 libxkbcommon0 \
          libxkbcommon-x11-0 libx11-xcb1 libxcb1 libxcb-cursor0 libxcb-glx0 \
          libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
          libxcb-render0 libxcb-render-util0 libxcb-shape0 libxcb-shm0 \
          libxcb-sync1 libxcb-util1 libxcb-xfixes0 libxcb-xinerama0 \
          libxcb-xkb1 libwayland-client0 libwayland-cursor0 libwayland-egl1 \
          xvfb xauth

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-build.txt

    - name: Generate gear set data
      run: python scripts/generate_gear_data.py

    - name: Create icon
      run: python scripts/create_icon.py

    - name: Run tests
      # One process for the whole suite. From 2026-10-15 the window-layout
      # test ran in a process of its own, after the whole suite crashed this
      # runner with an access violation in it; tests/conftest.py now frees
      # each test's windows on the UI thread (issue #18)
      run: |
        pip install pytest
        python -m pytest tests/ -q
      env:
        QT_QPA_PLATFORM: offscreen

    - name: Get version
      id: version
      run: python -c "from src.version import __version__; print(f'VERSION={__version__}')" >> $GITHUB_OUTPUT

    - name: Build GUI executable (onedir)
      run: python -m PyInstaller esolog-tail.spec --noconfirm

    # The Linux bundle is not launched by hand before a release, so start it
    # here on an X server: still running when the timeout stops it (exit 124)
    # is the pass.
    - name: Smoke test the bundle (X11)
      run: |
        status=0
        xvfb-run -a timeout 20 dist/esolog-gui/esolog-gui || status=$?
        cat ~/.config/esolog-tail/crash.log || true
        if [ "$status" -ne 124 ]; then
          echo "::error::bundle exited with status $status instead of staying up"
          exit 1
        fi
        if grep -q -E "Unhandled exception|Fatal Python error" ~/.config/esolog-tail/crash.log; then
          echo "::error::bundle logged a crash while starting"
          exit 1
        fi
      env:
        QT_QPA_PLATFORM: xcb

    - name: Create tarball
      run: |
        cp README.md icon.png dist/esolog-gui/
        mv dist/esolog-gui dist/esolog-tail-${{ steps.version.outputs.VERSION }}
        tar -czf dist/esolog-tail-linux-x86_64-${{ steps.version.outputs.VERSION }}.tar.gz \
          -C dist esolog-tail-${{ steps.version.outputs.VERSION }}

    - name: Upload tarball artifact
      uses: actions/upload-artifact@v7
      with:
        name: esolog-tail-linux-x86_64
        path: dist/esolog-tail-linux-x86_64-${{ steps.version.outputs.VERSION }}.tar.gz
        if-no-files-found: error

  # macOS (issue #32). These two jobs run for pull requests and manual runs,
  # not for tags: the app they build is ad-hoc signed, which Gatekeeper
  # refuses on a user's Mac, so no release carries it and the release job
  # does not wait for them. Signing and notarization come with the job that
  # will make a release wait.
  build-macos:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    # The oldest hosted macOS image, Apple Silicon. The app's minimum macOS
    # (LSMinimumSystemVersion in esolog-tail.spec) is the oldest system the
    # suite passes on here and the app starts on in smoke-macos
    runs-on: macos-15
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    # setup-python's Python, never Homebrew's: Homebrew's is built for the
    # macOS it runs on, and a bundle made with it runs nowhere older. The
    # stamp check below fails a build that got the wrong one
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'
        check-latest: true

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-build.txt

    - name: Generate gear set data
      run: python scripts/generate_gear_data.py

    - name: Create icon
      run: python scripts/create_icon.py

    - name: Run tests
      run: |
        pip install pytest
        python -m pytest tests/ -q
      env:
        QT_QPA_PLATFORM: offscreen

    - name: Get version
      id: version
      run: python -c "from src.version import __version__; print(f'VERSION={__version__}')" >> $GITHUB_OUTPUT

    - name: Build the app bundle
      run: python -m PyInstaller esolog-tail.spec --noconfirm

    - name: Check the minimum macOS of every binary
      run: python scripts/check_macos_stamps.py "dist/ESO Log Tail.app"

    # ditto keeps the bundle's symlinks and signature as Finder's own
    # "Compress" does; zip would not. "unsigned" is in the file's name and
    # the artifact's, so that it can never be taken for a release's file
    - name: Create zip
      run: |
        ditto -c -k --sequesterRsrc --keepParent "dist/ESO Log Tail.app" \
          "dist/esolog-tail-macos-arm64-${{ steps.version.outputs.VERSION }}-unsigned.zip"

    - name: Upload zip artifact
      uses: actions/upload-artifact@v7
      with:
        name: unsigned-macos-arm64
        path: dist/esolog-tail-macos-arm64-${{ steps.version.outputs.VERSION }}-unsigned.zip
        if-no-files-found: error

  # Start the zip, expanded as a download would be, on every macOS the app
  # claims to run on. A leg that is expected to fail is taken out, not left
  # red: when the app is released every leg will be in the release job's needs
  smoke-macos:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    needs: build-macos
    strategy:
      fail-fast: false
      matrix:
        # xcode-27 is an image named for its Xcode, on the newest macOS;
        # the first step prints which
        os: [macos-15, macos-26, xcode-27]
    runs-on: ${{ matrix.os }}
    steps:
    # For the smoke script and its fixture log; nothing is installed
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Show the macOS version and Gatekeeper's state
      run: |
        sw_vers
        spctl --status || true

    - name: Download the zip
      uses: actions/download-artifact@v8
      with:
        name: unsigned-macos-arm64
        path: download

    - name: Expand the zip
      run: ditto -x -k download/esolog-tail-macos-arm64-*-unsigned.zip app

    - name: Verify the signature
      run: codesign --verify --deep --strict --verbose=2 "app/ESO Log Tail.app"

    # The app draws with the cocoa platform plugin here, as on a user's Mac
    - name: Smoke test the app
      run: python3 scripts/smoke_macos.py "app/ESO Log Tail.app/Contents/MacOS/esolog-gui"

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-linux]
    # Pinned: GitHub moves ubuntu-latest to Ubuntu 26 from 2026-10-19,
    # and a release must not change runner under us unannounced
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    # The guard and the notes' starting point need the history and the tags
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    # Nothing is published unless the tag is a plain vX.Y.Z, names the
    # version in src/version.py, and sits on main (issue #134); the script
    # also names the previous tag for the notes
    - name: Check the tag
      id: guard
      run: python3 scripts/release_guard.py "$GITHUB_REF_NAME" "$GITHUB_SHA"

    - name: Download build artifacts
      uses: actions/download-artifact@v8
      with:
        path: dist
        merge-multiple: true

    # Pinned to a commit: this step holds the token that publishes the
    # files the app's update check offers to users
    - name: Create Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        files: |
          dist/esolog-tail-windows-setup-${{ needs.build-windows.outputs.version }}.exe
          dist/esolog-tail-windows-portable-${{ needs.build-windows.outputs.version }}.zip
          dist/esolog-tail-linux-x86_64-${{ needs.build-windows.outputs.version }}.tar.gz
        generate_release_notes: true
        fail_on_unmatched_files: true
        # Every release is born a beta (issue #134): a pre-release, which
        # GitHub never makes the latest, so the app's Stable channel and the
        # home page's buttons stay where they are until
        # scripts/promote_release.py makes it Stable
        prerelease: true
        make_latest: false
        previous_tag: ${{ steps.guard.outputs.previous }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
