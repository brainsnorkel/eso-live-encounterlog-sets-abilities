name: Build Installers

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-build.txt

    - name: Generate gear set data
      run: python scripts/generate_gear_data.py

    - name: Create icon
      run: python scripts/create_icon.py

    - name: Run tests
      run: |
        pip install pytest
        python -m pytest tests/ -q
      env:
        QT_QPA_PLATFORM: offscreen

    - name: Get version
      id: version
      shell: bash
      run: python -c "from src.version import __version__; print(f'VERSION={__version__}')" >> $GITHUB_OUTPUT

    - name: Build GUI executable (onedir, windowed)
      run: python -m PyInstaller esolog-tail.spec --noconfirm

    - name: Compile installer (Inno Setup)
      run: iscc /DAppVersion=${{ steps.version.outputs.VERSION }} installer\esolog-gui.iss

    - name: Create portable zip
      run: |
        Copy-Item README.md dist\esolog-gui\
        Compress-Archive -Path dist\esolog-gui\* -DestinationPath dist\esolog-tail-windows-portable-${{ steps.version.outputs.VERSION }}.zip

    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: esolog-tail-windows-setup
        path: dist/esolog-tail-windows-setup-${{ steps.version.outputs.VERSION }}.exe

    - name: Upload portable artifact
      uses: actions/upload-artifact@v4
      with:
        name: esolog-tail-windows-portable
        path: dist/esolog-tail-windows-portable-${{ steps.version.outputs.VERSION }}.zip

  build-linux:
    # The oldest hosted image: the bundle runs on this glibc (2.35) and newer
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # Qt's X11 and Wayland plugins link against these. PyInstaller bundles
    # the ones it finds, so installing them here is what lets the tarball
    # start on a desktop that lacks them (libxcb-cursor0 is a common gap).
    - name: Install Qt system libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libegl1 libgl1 libdbus-1-3 libfontconfig1 libxkbcommon0 \
          libxkbcommon-x11-0 libx11-xcb1 libxcb1 libxcb-cursor0 libxcb-glx0 \
          libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
          libxcb-render0 libxcb-render-util0 libxcb-shape0 libxcb-shm0 \
          libxcb-sync1 libxcb-util1 libxcb-xfixes0 libxcb-xinerama0 \
          libxcb-xkb1 libwayland-client0 libwayland-cursor0 libwayland-egl1 \
          xvfb xauth

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-build.txt

    - name: Generate gear set data
      run: python scripts/generate_gear_data.py

    - name: Create icon
      run: python scripts/create_icon.py

    - name: Run tests
      run: |
        pip install pytest
        python -m pytest tests/ -q
      env:
        QT_QPA_PLATFORM: offscreen

    - name: Get version
      id: version
      run: python -c "from src.version import __version__; print(f'VERSION={__version__}')" >> $GITHUB_OUTPUT

    - name: Build GUI executable (onedir)
      run: python -m PyInstaller esolog-tail.spec --noconfirm

    # The Linux bundle is not launched by hand before a release, so start it
    # here on an X server: still running when the timeout stops it (exit 124)
    # is the pass.
    - name: Smoke test the bundle (X11)
      run: |
        status=0
        xvfb-run -a timeout 20 dist/esolog-gui/esolog-gui || status=$?
        cat ~/.config/esolog-tail/crash.log || true
        if [ "$status" -ne 124 ]; then
          echo "::error::bundle exited with status $status instead of staying up"
          exit 1
        fi
        if grep -q -E "Unhandled exception|Fatal Python error" ~/.config/esolog-tail/crash.log; then
          echo "::error::bundle logged a crash while starting"
          exit 1
        fi
      env:
        QT_QPA_PLATFORM: xcb

    - name: Create tarball
      run: |
        cp README.md icon.png dist/esolog-gui/
        mv dist/esolog-gui dist/esolog-tail-${{ steps.version.outputs.VERSION }}
        tar -czf dist/esolog-tail-linux-x86_64-${{ steps.version.outputs.VERSION }}.tar.gz \
          -C dist esolog-tail-${{ steps.version.outputs.VERSION }}

    - name: Upload tarball artifact
      uses: actions/upload-artifact@v4
      with:
        name: esolog-tail-linux-x86_64
        path: dist/esolog-tail-linux-x86_64-${{ steps.version.outputs.VERSION }}.tar.gz
        if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/esolog-tail-windows-setup-${{ needs.build-windows.outputs.version }}.exe
          dist/esolog-tail-windows-portable-${{ needs.build-windows.outputs.version }}.zip
          dist/esolog-tail-linux-x86_64-${{ needs.build-windows.outputs.version }}.tar.gz
        generate_release_notes: true
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
