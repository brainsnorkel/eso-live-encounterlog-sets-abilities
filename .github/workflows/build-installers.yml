name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-build.txt

    - name: Generate gear set data
      run: python scripts/generate_gear_data.py

    - name: Create icon
      run: python scripts/create_icon.py

    - name: Run tests
      run: |
        pip install pytest
        python -m pytest tests/ -q
      env:
        QT_QPA_PLATFORM: offscreen

    - name: Get version
      id: version
      shell: bash
      run: python -c "from src.version import __version__; print(f'VERSION={__version__}')" >> $GITHUB_OUTPUT

    - name: Build GUI executable (onedir, windowed)
      run: python -m PyInstaller esolog-tail.spec --noconfirm

    - name: Compile installer (Inno Setup)
      run: iscc /DAppVersion=${{ steps.version.outputs.VERSION }} installer\esolog-gui.iss

    - name: Create portable zip
      run: |
        Copy-Item README.md dist\esolog-gui\
        Compress-Archive -Path dist\esolog-gui\* -DestinationPath dist\esolog-tail-windows-portable-${{ steps.version.outputs.VERSION }}.zip

    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: esolog-tail-windows-setup
        path: dist/esolog-tail-windows-setup-${{ steps.version.outputs.VERSION }}.exe

    - name: Upload portable artifact
      uses: actions/upload-artifact@v4
      with:
        name: esolog-tail-windows-portable
        path: dist/esolog-tail-windows-portable-${{ steps.version.outputs.VERSION }}.zip

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/esolog-tail-windows-setup-${{ steps.version.outputs.VERSION }}.exe
          dist/esolog-tail-windows-portable-${{ steps.version.outputs.VERSION }}.zip
        generate_release_notes: true
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
